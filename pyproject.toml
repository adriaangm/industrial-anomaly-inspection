[project]
name = "industrial-anomaly-inspection"
version = "0.4.0"
description = "Unsupervised visual anomaly detection for industrial inspection, deployable as a ROS 2 node"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",  # pin to match the apt-installed cv_bridge ABI (ros-jazzy-cv-bridge)
    "opencv-python-headless>=4.10",
    "onnx>=1.17",
    "onnxruntime-gpu[cuda,cudnn]>=1.22",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
train = [
    "anomalib>=2.6,<2.7",
    "torch>=2.7",
    "torchvision>=0.22",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "onnxscript>=0.3",
]

[project.scripts]
aii-benchmark = "anomaly_inspection.benchmark:main"
aii-export = "anomaly_inspection.export:main"
aii-evaluate-onnx = "anomaly_inspection.runtime.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_inspection"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
