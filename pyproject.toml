[project]
name = "industrial-anomaly-inspection"
version = "0.1.0"
description = "Unsupervised visual anomaly detection for industrial inspection, deployable as a ROS 2 node"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib>=2.6,<2.7",
    "torch>=2.7",
    "torchvision>=0.22",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
